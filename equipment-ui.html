<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#142b44">
  <title>Equipamentos — Clash of Izzy</title>
  <link rel="stylesheet" href="/styles/coi-theme.css">
  <link rel="stylesheet" href="/equipment-styles.css">
</head>
<body style="background:#0f0f1e;padding:10px">
  <main class="mobile-equipment-container">
    <a href="/equipment-lab.html" class="forge-link">⚒️ Abrir Forja Real · Equipamentos, pesquisas e skins nórdicas</a>
    <header class="item-header">
      <h2 id="item-name">Carregando...</h2>
      <span id="rarity-badge" class="rarity-badge lendario">Lendário</span>
      <button class="lock-btn" type="button" id="lock-btn">🔓 Destravado</button>
    </header>
    <label for="hero-select">Herói que usará o equipamento</label>
    <select id="hero-select" aria-label="Selecionar herói" style="width:100%;padding:10px;margin:8px 0 14px;border-radius:8px;background:#17283c;color:#fff;border:1px solid #b88b45"></select>
    <p id="equipment-status" role="status" aria-live="polite">Sincronizando inventário...</p>
    <div class="stats-preview">
      <div class="stat-column current">
        <h3>Nível <span id="current-level">1</span></h3>
        <p id="current-def">Atributos atuais</p>
        <p id="current-res">Não equipado</p>
      </div>
      <div class="stat-arrow">➡️</div>
      <div class="stat-column next">
        <h3>Nível <span id="next-level">2</span></h3>
        <p id="next-def">Próximos atributos</p>
        <p id="next-res">Slot</p>
      </div>
    </div>
    <div class="action-area">
      <div class="cost-display">
        Custo: <span id="upgrade-cost">130</span> 🪙 Ouro
        <small>Seu ouro: <span id="player-gold">0</span> 🪙</small>
      </div>
      <button id="equip-btn" type="button">EQUIPAR NESTE HERÓI</button>
      <button id="unequip-btn" type="button" class="secondary">DESEQUIPAR</button>
      <button id="upgrade-btn" type="button" class="upgrade-btn-mobile">⚒️ EVOLUIR EQUIPAMENTO</button>
    </div>
  </main>
  <script src="/equipment-system.js"></script>
</body>
</html>
