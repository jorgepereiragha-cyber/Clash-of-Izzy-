<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a2b"><title>Clash of Izzy</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#080e18;color:#f5edda}
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 38%,#294968 0,#101a2b 48%,#080e18 100%)}
main{width:min(100%,520px);text-align:center}
img{display:block;width:min(58vw,220px);height:auto;margin:0 auto 24px;filter:drop-shadow(0 18px 32px #0009)}
h1{margin:0;color:#e7bd68;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,7vw,44px);letter-spacing:.09em}
p{margin:12px 0 26px;color:#c6d2df;letter-spacing:.08em}
.track{height:5px;overflow:hidden;border-radius:99px;background:#263b52;border:1px solid #d6aa5a66}
.track span{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#9a682d,#ffe3a0);animation:travel 1.6s ease-in-out infinite alternate}
@keyframes travel{from{transform:translateX(-5%)}to{transform:translateX(175%)}}
@media(prefers-reduced-motion:reduce){.track span{animation:none;width:100%}}
</style></head>
<body><main aria-live="polite"><img src="/icon-512.svg" alt="Brasão de Clash of Izzy"><h1>CLASH OF IZZY</h1><p>PREPARE SEU REINO</p><div class="track" role="progressbar" aria-label="Carregando" aria-valuemin="0" aria-valuemax="100"><span></span></div></main></body></html>
