<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1422">
  <meta name="description" content="Clash of Izzy — estratégia medieval entre reinos.">
  <title>Clash of Izzy · Sem conexão</title>
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/visual-system.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#294765 0%,#14263b 42%,#0b1422 100%);color:#f5edda;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:min(100%,440px);padding:32px 24px;border:1px solid rgba(229,184,94,.42);border-radius:20px;background:linear-gradient(155deg,rgba(32,56,80,.97),rgba(13,25,41,.98));box-shadow:0 12px 32px rgba(0,0,0,.38)}
    h1{margin:8px 0 12px;color:#ffda83;font-size:clamp(22px,6vw,28px)}
    p{color:#cbd5e1;line-height:1.6}
    button{min-height:48px;padding:12px 22px;border:1px solid #f5d58d;border-radius:10px;background:linear-gradient(180deg,#ffda83,#e5b85e 58%,#b77d37);color:#21180d;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="coi-brand" aria-label="Clash of Izzy">
      <img src="/icon-192.svg" alt="Brasão oficial do Clash of Izzy" width="48" height="48">
      <span>CLASH OF IZZY</span>
    </div>
    <h1>Você está sem conexão</h1>
    <p>O reino e as batalhas precisam de Internet para sincronizar com segurança. Reconecte-se e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
