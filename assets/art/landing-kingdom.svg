  <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#688753"/><stop offset="1" stop-color="#293f35"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0d4b4"/><stop offset=".52" stop-color="#a99d82"/><stop offset="1" stop-color="#6f7269"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4f7da3"/><stop offset=".45" stop-color="#24476b"/><stop offset="1" stop-color="#142a43"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe9ad"/><stop offset=".5" stop-color="#e7bd68"/><stop offset="1" stop-color="#95632e"/></linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ad2d8"/><stop offset=".48" stop-color="#438ba0"/><stop offset="1" stop-color="#1d4a68"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9936c"/><stop offset="1" stop-color="#594c3c"/></linearGradient>
