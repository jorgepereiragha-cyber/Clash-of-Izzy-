  <g id="pine"><path d="M0 0-33 52H-15L-42 89H42L15 52H33Z" fill="#183b35" stroke="#9eaa70" stroke-opacity=".34" stroke-width="3"/><path d="M-5 80H5V112H-5Z" fill="#5b4631"/></g>
