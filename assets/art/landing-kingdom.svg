  <pattern id="roofTiles" width="28" height="18" patternUnits="userSpaceOnUse"><path d="M0 1H28M14 1V18" fill="none" stroke="#b6d1df" stroke-opacity=".35" stroke-width="2"/></pattern>
  <pattern id="grassGrain" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M5 23l3-7m13 15 2-6m3-16 3-5" stroke="#d7d69c" stroke-opacity=".26" stroke-width="2" stroke-linecap="round"/></pattern>
