<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">O reino de Clash of Izzy</title>
<desc id="desc">Castelo medieval de pedra com telhados azul-real e detalhes dourados, cercado por muralhas, florestas, montanhas e um rio.</desc>
<defs>
