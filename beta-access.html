<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Clash of Izzy | Beta fechado</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#263d67,#081525 70%);color:#f8edda;display:grid;place-items:center;padding:18px}
main{width:min(100%,420px);padding:32px 25px;border:1px solid #a48651;border-radius:20px;background:#0b1929ed;box-shadow:0 12px 44px #0008}
h1{font-size:1.6rem;margin:0 0 10px;color:#f4d69a}p{line-height:1.5;color:#d3deeb}
label{display:block;margin:22px 0 10px;font-weight:600}input{width:100%;padding:15px;font-size:1rem;letter-spacing:.04em;background:#07111f;border:1px solid #9e8a66;border-radius:9px;color:white}
button{cursor:pointer;display:block;width:100%;margin-top:16px;padding:15px;font-weight:700;font-size:1rem;background:#e6bd72;color:#091524;border:0;border-radius:9px}
button:disabled{opacity:.65;cursor:wait}#status{min-height:26px;font-weight:600}small{color:#a8b7c8}
</style>
</head>
<body>
<main>
<h1>Clash of Izzy · Beta fechado</h1>
<p>Este ambiente é separado do jogo oficial. Digite o código recebido no convite para acessar o seu reino de teste.</p>
<form id="form">
<label for="code">Código de convite</label>
<input id="code" name="code" type="text" placeholder="IZZY-..." autocomplete="off" maxlength="25" required spellcheck="false">
<button id="submit" type="submit">Entrar no beta</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<small>O acesso é limitado. O beta não aceita pagamentos reais nesta fase.</small>
</main>
<script>
const form=document.getElementById("form"),button=document.getElementById("submit"),status=document.getElementById("status");
form.addEventListener("submit",async e=>{
  e.preventDefault();button.disabled=true;status.textContent="Validando convite...";
  try{
    const res=await fetch("/api/beta/invite/redeem",{
      method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
      body:JSON.stringify({code:document.getElementById("code").value})
    });
    if(!res.ok){status.textContent=res.status===429?"Muitas tentativas. Tente novamente mais tarde.":"Convite inválido, expirado ou indisponível.";return;}
    window.location.replace("/kingdom.html");
  }catch{status.textContent="Sem conexão. Verifique a internet e tente novamente."}
  finally{button.disabled=false}
});
</script>
</body>
</html>
