name: Deploy Clash of Izzy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clash-of-izzy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    name: Validate, migrate and deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required files
        run: |
          test -f worker.js || (echo "worker.js not found" && exit 1)
          test -f wrangler.jsonc || (echo "wrangler.jsonc not found" && exit 1)
          test -d migrations || (echo "migrations directory not found" && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Validate Worker bundle
        run: npx wrangler --config wrangler.jsonc deploy --dry-run --outdir=dist

      - name: Test D1 migrations locally
        run: npx wrangler --config wrangler.jsonc d1 migrations apply clash-of-izzy-db --local

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          token = os.environ.get("RAW_CLOUDFLARE_API_TOKEN", "").strip()
          if token[:7].lower() == "bearer ":
              token = token[7:].strip()
          if len(token) >= 2 and token[0] == token[-1] and token[0] in ("'", '"'):
              token = token[1:-1].strip()
          if not token or any(ch.isspace() for ch in token):
              raise SystemExit("CLOUDFLARE_API_TOKEN vazio ou com espaços internos; confira o segredo no GitHub.")
          print("::add-mask::" + token)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("CLOUDFLARE_API_TOKEN=" + token + "\n")
          PY

      - name: Verify Cloudflare API token
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not account_id:
              raise SystemExit("CLOUDFLARE_ACCOUNT_ID ausente. Configure o ID da conta nos GitHub Actions secrets.")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not token:
              raise SystemExit("Token Cloudflare ausente. Configure CLOUDFLARE_API_TOKEN nos GitHub Actions secrets.")

          request = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/user/tokens/verify",
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  f"Cloudflare rejeitou o token (HTTP {error.code}). Gere um API Token novo e atualize CLOUDFLARE_API_TOKEN."
              )
          except Exception as error:
              raise SystemExit(f"Não foi possível validar o token Cloudflare: {type(error).__name__}")

          result = payload.get("result") or {}
          if not payload.get("success") or result.get("status") != "active":
              raise SystemExit("O token Cloudflare não está ativo. Gere um token novo e atualize CLOUDFLARE_API_TOKEN.")
          print("Token Cloudflare válido e ativo.")
          PY

      - name: Apply D1 migrations remotely
        run: npx wrangler --config wrangler.jsonc d1 migrations apply clash-of-izzy-db --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        id: deploy_worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler --config wrangler.jsonc deploy 2>&1 | tee "$RUNNER_TEMP/clash-of-izzy-deploy.log"
          WORKER_BASE_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/clash-of-izzy-deploy.log" | tail -n 1 || true)"
          if [[ -z "$WORKER_BASE_URL" ]]; then
            echo "::error::Wrangler não informou a URL workers.dev; confira workers_dev no wrangler.jsonc e os domínios do Worker."
            exit 1
          fi
          echo "WORKER_BASE_URL=$WORKER_BASE_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production Worker
        run: node scripts/production-smoke.js
        env:
          WORKER_BASE_URL: ${{ env.WORKER_BASE_URL }}
