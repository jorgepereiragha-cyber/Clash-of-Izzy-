name: Deploy Clash of Izzy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_paid_plan:
        description: "Confirme Workers Paid e limites de gastos no Dashboard"
        required: true
        default: false
        type: boolean
      confirm_gameplay_4x:
        description: "Liberar jogabilidade 4X somente apos homologacao e auditoria D1"
        required: false
        default: false
        type: boolean
      confirm_production:
        description: "Confirma migrações D1 remotas e publicação do Worker em produção"
        required: true
        default: false
        type: boolean

concurrency:
  group: clash-of-izzy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_paid_plan == true && inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    permissions:
      contents: read
    name: Validate, migrate and deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required files
        run: |
          test -f worker.js || (echo "worker.js not found" && exit 1)
          test -f wrangler.jsonc || (echo "wrangler.jsonc not found" && exit 1)
          test -d migrations || (echo "migrations directory not found" && exit 1)

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Validate Worker bundle
        env:
          CONFIRM_GAMEPLAY_4X: ${{ inputs.confirm_gameplay_4x }}
        run: |
          npx wrangler --config wrangler.jsonc deploy --dry-run --outdir=dist --var GAME_4X_SYSTEMS_ENABLED:"$CONFIRM_GAMEPLAY_4X"

      - name: Test D1 migrations locally
        run: npx wrangler --config wrangler.jsonc d1 migrations apply clash-of-izzy-db --local

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          token = os.environ.get("RAW_CLOUDFLARE_API_TOKEN", "").strip()
          if token[:7].lower() == "bearer ":
              token = token[7:].strip()
          if len(token) >= 2 and token[0] == token[-1] and token[0] in ("'", '"'):
              token = token[1:-1].strip()
          if not token or any(ch.isspace() for ch in token):
              raise SystemExit("CLOUDFLARE_API_TOKEN vazio ou com espaços internos; confira o segredo no GitHub.")
          print("::add-mask::" + token)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("CLOUDFLARE_API_TOKEN=" + token + "\n")
          PY

      - name: Verify Cloudflare API token
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not account_id:
              raise SystemExit("CLOUDFLARE_ACCOUNT_ID ausente. Configure o ID da conta nos GitHub Actions secrets.")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not token:
              raise SystemExit("Token Cloudflare ausente. Configure CLOUDFLARE_API_TOKEN nos GitHub Actions secrets.")

          request = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/user/tokens/verify",
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  f"Cloudflare rejeitou o token (HTTP {error.code}). Gere um API Token novo e atualize CLOUDFLARE_API_TOKEN."
              )
          except Exception as error:
              raise SystemExit(f"Não foi possível validar o token Cloudflare: {type(error).__name__}")

          result = payload.get("result") or {}
          if not payload.get("success") or result.get("status") != "active":
              raise SystemExit("O token Cloudflare não está ativo. Gere um token novo e atualize CLOUDFLARE_API_TOKEN.")
          print("Token Cloudflare válido e ativo.")
          PY

      - name: Verify remote Cloudflare before any D1 write (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COI_ALLOW_PENDING_0030: "true"
          COI_ALLOW_PENDING_0033: "true"
          COI_ALLOW_PENDING_0034: "true"
          COI_ALLOW_PENDING_0035: "true"
          COI_ALLOW_PENDING_0037_0039: "true"
        run: node scripts/cloudflare-remote-audit.mjs

      - name: Bloquear migrations comerciais pendentes no deploy completo (somente leitura)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          database="7e63af59-d9ff-4159-a9cf-b02e35b92605"
          url=f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query"
          data=json.dumps({"sql":"SELECT name FROM d1_migrations ORDER BY id"}).encode()
          request=urllib.request.Request(url,data=data,method="POST",
            headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"})
          with urllib.request.urlopen(request,timeout=30) as response:payload=json.load(response)
          if not payload.get("success") or not payload.get("result"):
              raise SystemExit("D1 history not verified; full production deploy refused.")
          applied={x["name"] for x in payload["result"][0].get("results",[])}
          commercial={
            "0040_support_packages.sql",
            "0042_level_packs_p1_p8.sql",
            "0043_fix_vip_catalog.sql",
            "0044_reconcile_level_packs.sql"
          }
          pending=commercial-applied
          if pending:
              print("::error::Full deploy blocked: unapproved commercial D1 migrations are pending.")
              print("Use protected repair-production-d1-core.yml for schema only through 0039.")
              raise SystemExit(1)
          print("Commercial migration history complete; full deploy requires separate existing approval gates.")
          PY

      - name: Verify new-payment gate and legacy dragon integrity (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e 'const c=JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8")); if(c.vars.LIVE_PAYMENTS_APPROVED!=="false")process.exit(1)'
          node scripts/check-worker-only-payment-state.mjs
          node scripts/verify-production-dragon-integrity.mjs

      - name: Capture D1 pre-deployment restore point
        id: capture_d1
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 7e63af59-d9ff-4159-a9cf-b02e35b92605
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          database_id = os.environ["D1_DATABASE_ID"].strip()
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/d1/database/{database_id}/time_travel/bookmark"
          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Não foi possível capturar o bookmark de recuperação D1 (HTTP {error.code}); migração bloqueada.")
          except Exception as error:
              raise SystemExit(f"Falha ao consultar Time Travel D1 ({type(error).__name__}); migração bloqueada.")

          bookmark = ((payload.get("result") or {}).get("bookmark") or "").strip()
          if not payload.get("success") or not bookmark:
              raise SystemExit("Cloudflare não retornou bookmark D1 válido; migração bloqueada.")

          record = {
              "database_name": "clash-of-izzy-db",
              "database_id": database_id,
              "captured_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "bookmark": bookmark,
              "recovery_command": "npx wrangler --config wrangler.jsonc d1 time-travel restore clash-of-izzy-db --bookmark=" + bookmark,
              "note": "D1 Time Travel restore point captured immediately before the production migrations. Restoring overwrites current database state.",
          }
          output_path = os.path.join(os.environ["RUNNER_TEMP"], "clash-of-izzy-d1-pre-migration-restore-point.json")
          with open(output_path, "w", encoding="utf-8") as output:
              json.dump(record, output, indent=2)
              output.write(chr(10))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("captured=true" + chr(10))
          print("::add-mask::" + bookmark)
          print("D1 Time Travel restore point captured; bookmark omitted from logs.")
          PY

      - name: Archive D1 pre-deployment restore point
        if: steps.capture_d1.outputs.captured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clash-of-izzy-d1-pre-migration-restore-point-${{ github.run_id }}
          path: ${{ runner.temp }}/clash-of-izzy-d1-pre-migration-restore-point.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply D1 migrations remotely
        run: npx wrangler --config wrangler.jsonc d1 migrations apply clash-of-izzy-db --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        id: deploy_worker
        shell: bash
        run: |
          set -euo pipefail
          case "$CONFIRM_GAMEPLAY_4X" in true|false) ;; *) exit 1;; esac
          npx wrangler --config wrangler.jsonc deploy --var GAME_4X_SYSTEMS_ENABLED:"$CONFIRM_GAMEPLAY_4X" 2>&1 | tee "$RUNNER_TEMP/clash-of-izzy-deploy.log"
          WORKER_BASE_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/clash-of-izzy-deploy.log" | tail -n 1 || true)"
          if [[ -z "$WORKER_BASE_URL" ]]; then
            echo "::error::Wrangler não informou a URL workers.dev; confira workers_dev no wrangler.jsonc e os domínios do Worker."
            exit 1
          fi
          echo "WORKER_BASE_URL=$WORKER_BASE_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_GAMEPLAY_4X: ${{ inputs.confirm_gameplay_4x }}

      - name: Verify live D1 schema and Android API contract after Worker deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-remote-audit.mjs
          node scripts/check-android-release-server.mjs

      - name: Smoke test production Worker
        run: |
          node scripts/production-smoke.js
          node scripts/check-worker-only-payment-state.mjs
          node --input-type=module -e 'const res=await fetch(process.env.WORKER_BASE_URL+"/api/health",{redirect:"error",signal:AbortSignal.timeout(12000)});const h=await res.json();if(!res.ok||h.gameplay4xEnabled!==(process.env.CONFIRM_GAMEPLAY_4X==="true"))throw Error("4X activation not verified");'
        env:
          WORKER_BASE_URL: ${{ env.WORKER_BASE_URL }}
          CONFIRM_GAMEPLAY_4X: ${{ inputs.confirm_gameplay_4x }}
