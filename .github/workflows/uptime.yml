name: Clash of Izzy uptime monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      public_url:
        description: "URL pública do jogo (ex.: https://jogo.exemplo.com)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: clash-of-izzy-uptime
  cancel-in-progress: true

jobs:
  check:
    if: ${{ vars.GAME_PUBLIC_URL != '' || inputs.public_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check public game readiness
        env:
          GAME_PUBLIC_URL: ${{ inputs.public_url || vars.GAME_PUBLIC_URL }}
        run: |
          set -euo pipefail
          URL="${GAME_PUBLIC_URL%/}"
          echo "Checking ${URL}/api/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 "${URL}/api/health"
          echo
          echo "Clash of Izzy is responding and its database readiness check passed."
