name: Publicar portal publico Cloudflare (sem alterar o jogo)

on:
  workflow_run:
    workflows: ["Clash of Izzy CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clash-of-izzy-portal-deploy
  cancel-in-progress: false

jobs:
  deploy-portal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar se o portal foi integrado
        id: available
        shell: bash
        run: |
          if test -f portal-worker.js && test -f wrangler.portal.jsonc; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Portal ainda não integrado na main: nenhuma publicação realizada."
          fi
      - name: Validar regras do portal e conteúdos estáticos
        if: steps.available.outputs.ready == 'true'
        run: |
          node --check portal-worker.js
          node --test tests/portal-isolation.test.js tests/portal-support.test.js
          python3 - <<'PY'
          from pathlib import Path
          root = Path("public-portal")
          allowed = {"portal.html", "support.html", "favicon.svg", "styles/coi-theme.css", "assets/brand/hero-emblem.svg", "assets/brand/royal-king.webp"}
          found = {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}
          assert found == allowed, f"Asset fora da allowlist: {found ^ allowed}"
          PY
      - name: Instalar Wrangler sem scripts de terceiros
        if: steps.available.outputs.ready == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verificar disponibilidade de credenciais Cloudflare
        if: steps.available.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("RAW_CLOUDFLARE_API_TOKEN", "").strip()
          if token[:7].lower() == "bearer ": token = token[7:].strip()
          if len(token) > 1 and token[0] == token[-1] and token[0] in ('"', "'"):
            token = token[1:-1].strip()
          if not account or not token or any(ch.isspace() for ch in token):
            raise SystemExit("Credenciais Cloudflare ausentes ou invalidas; o portal nao sera publicado.")
          print("::add-mask::" + token)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write("CLOUDFLARE_API_TOKEN=" + token + "\n")
            f.write("CLOUDFLARE_ACCOUNT_ID=" + account + "\n")
          PY
      - name: Publicar somente o Worker promocional, sem banco D1
        if: steps.available.outputs.ready == 'true'
        run: npx wrangler --config wrangler.portal.jsonc deploy
      - name: Verificar pagina e bloquear rotas internas no host promocional
        if: steps.available.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://clash-of-izzy-portal.jorgepereiragha.workers.dev"
          # Cloudflare pode levar alguns segundos para ativar assets após o deploy.
          # HTML canoniza /portal.html -> /portal: seguir redirecionamentos.
          page="$RUNNER_TEMP/portal-marketing-smoke.html"
          page_status="000"
          for attempt in 1 2 3 4 5 6; do
            page_status="$(curl -L --silent --show-error --max-time 20 \
              -o "$page" -w '%{http_code}' "$base/portal.html")" || page_status="000"
            if [[ "$page_status" == "200" ]] && grep -q 'id="download-apk"' "$page"; then break; fi
            sleep 4
          done
          [[ "$page_status" == "200" ]] && grep -q 'id="download-apk"' "$page" || {
            echo "::error::Portal não entregou HTML de propaganda após tentativas HTTP"; exit 1;
          }
          # Nova página de apoio: o site permanece público, sem requisições de compra.
          support_status="$(curl -L --silent --show-error --max-time 20 -o "$RUNNER_TEMP/portal-support.html" -w '%{http_code}' "$base/support.html")"
          test "$support_status" = "200" && grep -q 'id="support-payment-link"' "$RUNNER_TEMP/portal-support.html" || {
            echo "::error::Página de apoio não publicada corretamente"; exit 1;
          }
          link_status="$(curl -sS -o "$RUNNER_TEMP/support-link.json" -w '%{http_code}' --max-time 20 "$base/support-link.json")"
          test "$link_status" = "200" && grep -q '"enabled":' "$RUNNER_TEMP/support-link.json" || {
            echo "::error::Disponibilidade do link não foi respondida em JSON"; exit 1;
          }
          for path in /kingdom.html /api/game/state /arena.html /sw.js; do
            status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base$path")"
            test "$status" = "404" || { echo "::error::$path respondeu $status, esperado 404"; exit 1; }
          done
          echo "Portal publicado e URLs internas bloqueadas no host de propaganda."
