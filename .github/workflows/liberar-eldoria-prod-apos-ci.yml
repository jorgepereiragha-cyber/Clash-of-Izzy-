name: Legado Eldoria auto-release (desativado)

# Workflow antigo aposentado: nunca disparar deploy por workflow_run ou commit marcador.
# Use Cloudflare Paid Readiness (read-only) e, apos os gates comerciais,
# Deploy Clash of Izzy to Cloudflare com confirmacoes explicitas na UI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Informar desativacao do disparo automatico
        run: |
          echo '::error::O disparo automatizado Eldoria foi desativado. Use a auditoria read-only e o workflow oficial de producao com autorizacao explicita.'
          exit 1
