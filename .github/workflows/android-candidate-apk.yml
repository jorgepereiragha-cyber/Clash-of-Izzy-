name: Gerar APK Android interno assinado

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-candidate-apk.yml"
      - "android-sideload/**"
      - "tests/android-candidate-gates.test.js"
      - "tests/android-official-upgrade-version.test.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clash-izzy-android-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-candidate:
    name: APK interno assinado, sem release publica
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_VERSION_CODE: "3"
      ANDROID_VERSION_NAME: "0.9.2"
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bloquear commit ultrapassado na main
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha" || {
            echo "::error::A main mudou; nao assinar build de commit antigo."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar todas as regras e contratos antes da compilacao
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Instalar SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME" || exit 1
          sdkmanager_cmd="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_cmd"
          yes | "$sdkmanager_cmd" --licenses > /dev/null || true
          "$sdkmanager_cmd" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validar assinatura privada antes do build
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          CERT_PIN: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for val in "$KEYSTORE_B64" "$STORE_PASS" "$SIGNING_ALIAS" "$KEY_PASS" "$CERT_PIN"; do
            test -n "$val" || { echo "::error::Credenciais de assinatura ausentes."; exit 1; }
          done
          expected="$(printf '%s' "$CERT_PIN" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::SHA-256 de certificado invalido."; exit 1; }
          encoded="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if ! printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/clash-izzy-candidate.jks" 2>/dev/null; then
            echo "::error::Keystore Base64 invalida."
            exit 1
          fi
          unset encoded
          chmod 600 "$RUNNER_TEMP/clash-izzy-candidate.jks"
          keytool -list -keystore "$RUNNER_TEMP/clash-izzy-candidate.jks" -storepass "$STORE_PASS" > /dev/null
          keytool -certreq -alias "$SIGNING_ALIAS" -keystore "$RUNNER_TEMP/clash-izzy-candidate.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -file "$RUNNER_TEMP/clash-izzy-candidate.csr" > /dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/clash-izzy-candidate.jks" >> "$GITHUB_ENV"
      - name: Compilar candidato com a chave comercial permanente
        working-directory: android-sideload
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Conferir assinatura, identidade, versao e checksum
        shell: bash
        env:
          CERT_PIN: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          src=android-sideload/app/build/outputs/apk/release/app-release.apk
          test -s "$src"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$src"
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$src" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$CERT_PIN" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$actual" && "$actual" == "$expected" ]] || { echo "::error::Certificado nao corresponde ao pin."; exit 1; }
          metadata="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$src" | sed -n '1p')"
          [[ "$metadata" == *"name='com.clashofizzy.android'"* ]] || exit 1
          [[ "$metadata" == *"versionCode='$ANDROID_VERSION_CODE'"* ]] || exit 1
          [[ "$metadata" == *"versionName='$ANDROID_VERSION_NAME'"* ]] || exit 1
          cp "$src" "$RUNNER_TEMP/clash-of-izzy-android-candidato-interno.apk"
          (cd "$RUNNER_TEMP" && sha256sum clash-of-izzy-android-candidato-interno.apk > clash-of-izzy-android-candidato-interno.apk.sha256)
          (cd "$RUNNER_TEMP" && sha256sum -c clash-of-izzy-android-candidato-interno.apk.sha256)
          echo "APK interno assinado verificado; versao oficial futura exige versionCode maior que 3." >> "$GITHUB_STEP_SUMMARY"
          echo "Esta rotina NAO ativa cobrancas, NAO migra D1 e NAO publica GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar APK interno instalavel por 14 dias
        uses: actions/upload-artifact@v4
        with:
          name: clash-of-izzy-android-candidato-assinado
          path: |
            ${{ runner.temp }}/clash-of-izzy-android-candidato-interno.apk
            ${{ runner.temp }}/clash-of-izzy-android-candidato-interno.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Apagar material temporario da assinatura
        if: always()
        run: rm -f "$RUNNER_TEMP/clash-izzy-candidate.jks" "$RUNNER_TEMP/clash-izzy-candidate.csr"
