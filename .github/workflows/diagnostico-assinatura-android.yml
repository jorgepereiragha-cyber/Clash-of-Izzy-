name: Diagnostico seguro dos requisitos de assinatura Android

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostico-assinatura-android.yml"
      - "android-sideload/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Preparar keytool JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar credenciais, chave e certificado sem revelar segredos
        env:
          KS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          FINGERPRINT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in KS SP ALIAS KP; do
            if test -z "${!name}"; then
              echo "::error::Credencial de release não configurada: $name"
              missing=1
            fi
          done
          normalized="$(printf '%s' "$FINGERPRINT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$normalized" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 não configurado/ inválido."
            missing=1
          fi
          if test "$missing" = "1"; then
            echo "Assinatura comercial Android: PENDENTE. Nenhum segredo foi divulgado."
            echo "APK oficial bloqueado: credenciais e/ou pin ausentes." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tmp="$(mktemp -d "$RUNNER_TEMP/android-signing-check.XXXXXX")"
          chmod 700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          # A colagem pelo celular pode incluir quebras, espacos ou aspas externas.
          # Nunca imprimir o valor: ele contem a chave privada de assinatura.
          encoded="$(printf '%s' "$KS" | tr -d '[:space:]')"
          encoded="${encoded#\"}"
          encoded="${encoded%\"}"
          encoded="${encoded#\'}"
          encoded="${encoded%\'}"
          if ! printf '%s' "$encoded" | base64 --decode > "$tmp/release.jks" 2>/dev/null; then
            echo "::error::Keystore invalida: base64 nao decodifica."
            echo "APK oficial bloqueado: keystore invalida." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          chmod 600 "$tmp/release.jks"
          # Diagnosticos independentes, sem expor bytes, alias ou senhas.
          if ! keytool -list -keystore "$tmp/release.jks" -storepass "$SP" >/dev/null 2>&1; then
            echo "::error::Keystore nao abre com ANDROID_RELEASE_STORE_PASSWORD (ou arquivo nao e uma keystore)."
            echo "APK oficial bloqueado: keystore ou senha do armazenamento incompatível." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! keytool -exportcert -alias "$ALIAS" -keystore "$tmp/release.jks" \
                   -storepass "$SP" > "$tmp/cert.der" 2>/dev/null; then
            echo "::error::ANDROID_RELEASE_KEY_ALIAS nao existe na keystore validada."
            echo "APK oficial bloqueado: alias nao corresponde." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! keytool -certreq -alias "$ALIAS" -keystore "$tmp/release.jks" \
                   -storepass "$SP" -keypass "$KP" -file "$tmp/key-check.csr" >/dev/null 2>&1; then
            echo "::error::Chave privada ou senha da chave nao corresponde."
            echo "APK oficial bloqueado: chave privada inacessivel." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          actual="$(sha256sum "$tmp/cert.der" | cut -d' ' -f1)"
          if [[ "$actual" != "$normalized" ]]; then
            echo "::error::Certificado da keystore nao corresponde ao pin SHA-256 de release."
            echo "APK oficial bloqueado: divergencia no certificado de assinatura." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Assinatura comercial Android: credenciais e certificado verificados."
          echo "Chave privada, senha, alias e pin SHA-256 validados. Ainda faltam build oficial e testes em aparelho." >> "$GITHUB_STEP_SUMMARY"
          # Diagnostico informativo: nunca altera keystore, GitHub secrets, D1 ou release.
