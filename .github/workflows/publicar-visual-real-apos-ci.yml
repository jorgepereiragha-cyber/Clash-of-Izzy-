name: Legado Royal Skin auto-release (desativado)

# Workflow antigo aposentado: nunca disparar deploy por workflow_run ou commit marcador.
# A publicacao visual integra o mesmo deploy oficial protegido de producao.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Informar desativacao do disparo automatico
        run: |
          echo '::error::O disparo automatico Royal Skin foi desativado. Use o workflow oficial de producao apos homologacao e autorizacao explicita.'
          exit 1
