name: Diagnosticar recebimentos e login Google no Cloudflare (somente leitura)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auditar-comercio-cloudflare.yml"
      - "scripts/audit-cloudflare-commerce.mjs"
permissions:
  contents: read
jobs:
  commerce-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ler somente presenca e tipo de bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-cloudflare-commerce.mjs
