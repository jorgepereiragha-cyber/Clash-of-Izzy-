name: Legado desativado - publicar entrada Android no Worker atual

# A antiga publicacao era acionada por push neste proprio YAML e sobrescrevia
# o Worker atual com um snapshot antigo do backend (sem o gate de schema).
# Nunca reativar deploy automatizado deste workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Informar substituicao pelo fluxo protegido
        run: |
          echo "::notice::Workflow legado desativado. Nenhum deploy nem acesso a D1."
          echo "Para reparar o D1 ate 0039, use repair-production-d1-core.yml."
          echo "Para publicar o Worker apos health=200, use deploy-worker-only.yml."
