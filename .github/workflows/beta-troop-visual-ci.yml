name: Beta troop visuals (offline)
on:
  pull_request:
    branches: [beta]
  push:
    branches: [beta]
permissions:
  contents: read
jobs:
  troop-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run assets:validate
      - run: node --test tests/march-visual-path.test.js tests/world-map-mobile-performance.test.js tests/city-building-art.test.js tests/kingdom-entity-art.test.js tests/art-license-policy.test.js tests/asset-manifest-validation.test.js tests/kingdom-army-visual.test.js tests/kingdom-3d.test.js tests/kingdom-assets.test.js tests/millennium-budget-and-art.test.js tests/periodic-surface-grid.test.js tests/skin-art.test.js tests/castle-science.test.js tests/cosmetic-fairness.test.js
