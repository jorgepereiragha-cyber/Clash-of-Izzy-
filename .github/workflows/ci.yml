name: Clash of Izzy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/one-shared-realm-early-access, release/production-gameplay-hardened-20261125]

concurrency:
  group: clash-of-izzy-ci-${{ github.ref }}
  # Allow a running main push CI to finish even if newer commits arrive.
  # Superseded PR revisions may still cancel to save runner time.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate D1 migrations locally
        run: npx wrangler --config wrangler.jsonc d1 migrations apply clash-of-izzy-db --local
      - name: Validate isolated Preview D1 migrations locally
        run: npm run db:migrate:preview:local
      - name: Prove essential 0037-0039 repair with isolated local Wrangler D1
        run: node scripts/prove-d1-core-offline.mjs
      - name: Validate service worker
        run: node --check sw.js
      - name: Validate 3D asset manifest and local GLB files
        run: npm run assets:validate
      - name: Verify asset licenses, SHA-256 and generated credits
        run: npm run assets:licenses
      - name: Test gameplay rules and Worker-D1 integration
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate mobile kingdom UI in Chromium
        run: npm run test:e2e
      - name: Archive Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-kingdom-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive visual previews from synthetic mobile fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clash-of-izzy-visual-preview
          path: test-results/visual-preview/
          if-no-files-found: ignore
          retention-days: 7
      - name: Forensic diagnostic of production account endpoint (read-only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        env:
          PRODUCTION_DIAGNOSTIC_URL: https://clash-of-izzy.jorgepereiragha.workers.dev/api/account/status
        run: node scripts/diagnose-production-endpoint.js
      - name: Read-only production smoke test (informational)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        env:
          WORKER_BASE_URL: https://clash-of-izzy.jorgepereiragha.workers.dev
        run: node scripts/production-smoke.js
      - name: Validate Worker bundle
        run: npm run check
