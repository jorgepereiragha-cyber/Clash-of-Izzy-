name: Clash of Izzy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: clash-of-izzy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate service worker
        run: node --check sw.js
      - name: Validate kingdom command center script
        run: node --check command-center.js
      - name: Validate LiveOps engine
        run: node --check liveops-engine.js
      - name: Test LiveOps engine
        run: node --test tests/liveops-engine.test.js
      - name: Test combat simulator
        run: npm test
      - name: Validate Worker bundle
        run: npm run check
