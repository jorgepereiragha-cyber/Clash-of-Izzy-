name: Clash of Izzy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: clash-of-izzy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate D1 migrations locally
        run: npx wrangler --config wrangler.jsonc d1 migrations apply clash-of-izzy-db --local
      - name: Validate service worker
        run: node --check sw.js
      - name: Validate 3D asset manifest and local GLB files
        run: npm run assets:validate
      - name: Benchmark Draco and Meshopt variants without replacing originals
        run: npm run assets:optimize
      - name: Archive 3D optimization comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d-asset-compression-report
          path: node_modules/.cache/clash-of-izzy/3d-optimization/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test gameplay rules and Worker-D1 integration
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate mobile kingdom UI in Chromium
        run: npm run test:e2e
      - name: Archive Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-kingdom-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Forensic diagnostic of production account endpoint (read-only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        env:
          PRODUCTION_DIAGNOSTIC_URL: https://clash-of-izzy.jorgepereiragha.workers.dev/api/account/status
        run: node scripts/diagnose-production-endpoint.js
      - name: Read-only production smoke test (informational)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        env:
          WORKER_BASE_URL: https://clash-of-izzy.jorgepereiragha.workers.dev
        run: node scripts/production-smoke.js
      - name: Validate Worker bundle
        run: npm run check
