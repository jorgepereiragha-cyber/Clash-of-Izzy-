name: Clash of Izzy CI

on:
  push:
    branches: [main, feat/3d-kingdom-visual-pipeline, feat/adaptive-3d-quality-diagnostics]
  pull_request:
    branches: [main, security/api-rate-limits]

concurrency:
  group: clash-of-izzy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate service worker and 3D client module
        run: |
          node --check sw.js
          node --check scripts/kingdom-3d.js
          node --check scripts/kingdom-quality.js
      - name: Test combat simulator
        run: npm test
      - name: Validate D1 migrations locally
        run: npm run db:migrate:local
      - name: Validate Worker bundle
        run: npm run check
