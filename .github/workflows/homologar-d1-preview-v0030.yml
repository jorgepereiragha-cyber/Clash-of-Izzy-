name: Homologar D1 Preview - migracoes ate 0035

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/homologar-d1-preview-v0030.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clash-izzy-d1-preview-v0030-homologacao
  cancel-in-progress: false

jobs:
  homologar:
    # Nao permitir que workflow_dispatch rode migracoes remotas de codigo nao integrado.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar UUID, historico 0030 e ausencia de dados no Preview
        shell: bash
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          with open("wrangler.preview-migrations.jsonc",encoding="utf-8") as f: config=json.load(f)
          db=config["d1_databases"][0]
          preview="6674c0ac-3636-4e57-bff8-23cf60ab9637"
          prod="7e63af59-d9ff-4159-a9cf-b02e35b92605"
          if db["database_id"]!=preview or db["database_id"]==prod or db["binding"]!="PREVIEW_DB":
            raise SystemExit("Configuracao Preview mudou; migracao nao executada.")
          token=os.environ.get("RAW_TOKEN","").strip()
          if token.lower().startswith("bearer "): token=token[7:].strip()
          if len(token)>1 and token[0]==token[-1] and token[0] in ("'",'"'):
            token=token[1:-1].strip()
          account=os.environ.get("ACCOUNT_ID","").strip()
          if not token or not account or any(c.isspace() for c in token):
            raise SystemExit("Token ou Cloudflare Account ID ausentes.")
          print("::add-mask::"+token)
          base="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+preview
          req=urllib.request.Request(base+"/query",data=json.dumps({
            "sql":"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
          }).encode(),method="POST",headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
          try:
            with urllib.request.urlopen(req,timeout=25) as response: result=json.loads(response.read().decode())
          except urllib.error.HTTPError as e: raise SystemExit("D1 Preview API HTTP "+str(e.code))
          if not result.get("success"):raise SystemExit("D1 Preview indisponivel.")
          names={row["name"] for row in result["result"][0]["results"]}
          def query(sql):
            req=urllib.request.Request(base+"/query",data=json.dumps({"sql":sql}).encode(),
              method="POST",headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
            try:
              with urllib.request.urlopen(req,timeout=25) as response: value=json.loads(response.read().decode())
            except urllib.error.HTTPError as e:raise SystemExit("Consulta segura do Preview HTTP "+str(e.code))
            if not value.get("success"):raise SystemExit("D1 Preview nao confirmou estado pre-migracao.")
            return value["result"][0]["results"]
          # Aceitar um Preview realmente novo OU a candidata previamente homologada ate 0030,
          # desde que nao existam jogadores, castelos, territorios ou transacoes.
          if not (names - {"d1_migrations","_cf_KV"}):
            if "d1_migrations" in names:
              if int(query("SELECT COUNT(*) AS total FROM d1_migrations")[0]["total"])!=0:
                raise SystemExit("Preview possui historico de migracoes sem esquema; revisar antes.")
            print("D1 Preview novo e vazio: executar migrations iniciais.")
          else:
            required={"d1_migrations","players","kingdoms","player_accounts",
              "purchase_requests","mercadopago_orders","world_territories",
              "vip_packages","kingdom_dragons","kingdom_mailbox","master_bonus_claims"}
            if not required.issubset(names):
              raise SystemExit("Preview contem esquema parcial ou desconhecido; revisao obrigatoria.")
            forbidden={"google_account_links","google_auth_challenges",
              "realm_openings","realm_thrones","throne_assaults"}
            if names & forbidden:
              raise SystemExit("Tabelas 0033-0035 ja existem; conferir historico antes de migrar.")
            history=query("SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1")
            if not history or history[0].get("name")!="0030_dragons_master_mailbox.sql":
              raise SystemExit("Preview deve estar exatamente em 0030; migracao incremental bloqueada.")
            count=query("SELECT "
              "(SELECT COUNT(*) FROM players) AS players,"
              "(SELECT COUNT(*) FROM kingdoms) AS kingdoms,"
              "(SELECT COUNT(*) FROM player_accounts) AS player_accounts,"
              "(SELECT COUNT(*) FROM purchase_requests) AS purchase_requests,"
              "(SELECT COUNT(*) FROM mercadopago_orders) AS mercadopago_orders,"
              "(SELECT COUNT(*) FROM world_territories) AS world_territories")[0]
            if any(int(value)!=0 for value in count.values()):
              raise SystemExit("Preview contem jogadores, reinos, territorios ou pagamentos: nao alterar.")
            print("D1 Preview ate 0030, sem dados de jogadores ou transacoes: autorizar SOMENTE migrations incrementais 0031-0035.")
          print("UUID Preview conferido; nenhuma operacao sobre D1 producao.")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
            f.write("CLOUDFLARE_API_TOKEN="+token+"\n")
            f.write("CLOUDFLARE_ACCOUNT_ID="+account+"\n")
          PY
      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Testar migracoes locais antes do D1 Preview
        run: |
          npx wrangler --config wrangler.preview-migrations.jsonc d1 migrations apply PREVIEW_DB --local
          node --test tests/dragons-master-pack.test.js tests/castle-vip.test.js tests/hero-presentation.test.js
      - name: Registrar bookmark D1 Preview antes de alterar esquema
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          db="6674c0ac-3636-4e57-bff8-23cf60ab9637"
          url="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+db+"/time_travel/bookmark"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token})
          try:
            with urllib.request.urlopen(req,timeout=25) as response: record=json.loads(response.read().decode())
            bookmark=(record.get("result") or {}).get("bookmark")
          except urllib.error.HTTPError as e:
            # Preview sem jogadores/ordens; restauracao nunca e teste de producao.
            print("::warning::D1 Preview vazio sem bookmark (HTTP "+str(e.code)+").")
            bookmark=None
          with open(os.path.join(os.environ["RUNNER_TEMP"],"preview-restore-metadata.json"),"w") as f:
            json.dump({"database":"izzy-preview-17112026","database_id":db,"bookmark":bookmark,
              "reason":"D1 Preview auditado, sem jogadores/ordens antes de migrations 0031-0035; nao e backup de producao."},f)
          print("Metadados de recuperacao do Preview gravados.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clash-izzy-preview-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-restore-metadata.json
          retention-days: 30
          if-no-files-found: error
      - name: Aplicar migrations ao banco Preview isolado (nunca producao)
        run: npx wrangler --config wrangler.preview-migrations.jsonc d1 migrations apply PREVIEW_DB --remote
      - name: Verificar esquema completo ate 0035 no Preview
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["ACCOUNT_ID"]
          db="6674c0ac-3636-4e57-bff8-23cf60ab9637"
          url="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+db+"/query"
          sql="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('players','kingdoms','player_accounts','purchase_requests','mercadopago_orders','kingdom_dragons','kingdom_mailbox','master_bonus_claims','google_account_links','google_auth_challenges','realm_openings','realm_thrones','throne_assaults','d1_migrations')"
          req=urllib.request.Request(url,data=json.dumps({"sql":sql}).encode(),method="POST",headers={
            "Authorization":"Bearer "+token,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as response: value=json.loads(response.read().decode())
          if not value.get("success"): raise SystemExit("D1 Preview nao confirmou o esquema.")
          present={row["name"] for row in value["result"][0]["results"]}
          expected={"players","kingdoms","player_accounts","purchase_requests","mercadopago_orders","kingdom_dragons","kingdom_mailbox","master_bonus_claims","google_account_links","google_auth_challenges","realm_openings","realm_thrones","throne_assaults","d1_migrations"}
          if present!=expected: raise SystemExit("Tabelas de Preview incompletas: "+str(sorted(expected-present)))
          sql="SELECT COUNT(*) AS total FROM d1_migrations WHERE name IN ('0030_dragons_master_mailbox.sql','0031_entry_package_399.sql','0032_daily_packages.sql','0033_google_account_links.sql','0034_progressive_realms.sql','0035_throne_war.sql')"
          req=urllib.request.Request(url,data=json.dumps({"sql":sql}).encode(),method="POST",headers={
            "Authorization":"Bearer "+token,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as response: value=json.loads(response.read().decode())
          if not value.get("success") or int(value["result"][0]["results"][0]["total"])!=6:
            raise SystemExit("Migrations 0030-0035 nao confirmadas no Preview.")
          # Preview era vazio; validar mundo 1 desbloqueado e escudo inicial do trono por 35 dias.
          sql=("SELECT (SELECT COUNT(*) FROM realm_openings) AS mundos, "
               "(SELECT COUNT(*) FROM realm_thrones t JOIN realm_openings r ON r.realm_id=t.realm_id "
               "WHERE t.realm_id=1 AND t.shield_until=datetime(r.unlocked_at,'+35 days')) AS tronos")
          req=urllib.request.Request(url,data=json.dumps({"sql":sql}).encode(),method="POST",headers={
            "Authorization":"Bearer "+token,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as response: value=json.loads(response.read().decode())
          if not value.get("success"): raise SystemExit("D1 Preview nao confirmou regras do trono.")
          row=value["result"][0]["results"][0]
          if int(row["mundos"])!=1 or int(row["tronos"])!=1:
            raise SystemExit("Mundos ou escudo inicial de 35 dias nao conferem no D1 Preview.")
          print("PASSOU: D1 Preview isolado, migrations 0030-0035, 14 tabelas essenciais, reino 1 e trono com escudo de 35 dias. Producao nao modificada.")
          PY
