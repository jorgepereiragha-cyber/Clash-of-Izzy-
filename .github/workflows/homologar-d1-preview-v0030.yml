name: Homologar D1 Preview - migracoes ate 0030

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/homologar-d1-preview-v0030.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clash-izzy-d1-preview-v0030-homologacao
  cancel-in-progress: false

jobs:
  homologar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar UUID isolado, banco Preview vazio e credenciais
        shell: bash
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          with open("wrangler.preview-migrations.jsonc",encoding="utf-8") as f: config=json.load(f)
          db=config["d1_databases"][0]
          preview="6674c0ac-3636-4e57-bff8-23cf60ab9637"
          prod="7e63af59-d9ff-4159-a9cf-b02e35b92605"
          if db["database_id"]!=preview or db["database_id"]==prod or db["binding"]!="PREVIEW_DB":
            raise SystemExit("Configuracao Preview mudou; migracao nao executada.")
          token=os.environ.get("RAW_TOKEN","").strip()
          if token.lower().startswith("bearer "): token=token[7:].strip()
          if len(token)>1 and token[0]==token[-1] and token[0] in ("'",'"'):
            token=token[1:-1].strip()
          account=os.environ.get("ACCOUNT_ID","").strip()
          if not token or not account or any(c.isspace() for c in token):
            raise SystemExit("Token ou Cloudflare Account ID ausentes.")
          print("::add-mask::"+token)
          base="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+preview
          req=urllib.request.Request(base+"/query",data=json.dumps({
            "sql":"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
          }).encode(),method="POST",headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
          try:
            with urllib.request.urlopen(req,timeout=25) as response: result=json.loads(response.read().decode())
          except urllib.error.HTTPError as e: raise SystemExit("D1 Preview API HTTP "+str(e.code))
          if not result.get("success"):raise SystemExit("D1 Preview indisponivel.")
          names={row["name"] for row in result["result"][0]["results"]}
          # _cf_KV pertence ao motor D1 e nao contem dados do aplicativo.
          if names - {"d1_migrations","_cf_KV"}:
            raise SystemExit("Preview ja possui tabelas de aplicacao: migracao exige revisao para preservar dados.")
          if "d1_migrations" in names:
            req=urllib.request.Request(base+"/query",data=json.dumps({
              "sql":"SELECT COUNT(*) AS total FROM d1_migrations"
            }).encode(),method="POST",headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
            with urllib.request.urlopen(req,timeout=25) as response: applied=json.loads(response.read().decode())
            if not applied.get("success") or int(applied["result"][0]["results"][0]["total"])!=0:
              raise SystemExit("Preview ja possui historico de migracoes; operacao exige revisao.")
          print("D1 Preview sem tabelas e sem migrations aplicadas. ID verificado; producao protegida.")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
            f.write("CLOUDFLARE_API_TOKEN="+token+"\n")
            f.write("CLOUDFLARE_ACCOUNT_ID="+account+"\n")
          PY
      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Testar migracoes locais antes do D1 Preview
        run: |
          npx wrangler --config wrangler.preview-migrations.jsonc d1 migrations apply PREVIEW_DB --local
          node --test tests/dragons-master-pack.test.js tests/castle-vip.test.js tests/hero-presentation.test.js
      - name: Registrar bookmark D1 Preview antes de alterar esquema
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          db="6674c0ac-3636-4e57-bff8-23cf60ab9637"
          url="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+db+"/time_travel/bookmark"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token})
          try:
            with urllib.request.urlopen(req,timeout=25) as response: record=json.loads(response.read().decode())
            bookmark=(record.get("result") or {}).get("bookmark")
          except urllib.error.HTTPError as e:
            # Preview foi comprovadamente vazio; nao e um backup de producao.
            print("::warning::D1 Preview vazio sem bookmark (HTTP "+str(e.code)+").")
            bookmark=None
          with open(os.path.join(os.environ["RUNNER_TEMP"],"preview-restore-metadata.json"),"w") as f:
            json.dump({"database":"izzy-preview-17112026","database_id":db,"bookmark":bookmark,
              "reason":"D1 Preview vazio auditado antes de migrations v0030; nao e backup da producao."},f)
          print("Metadados de recuperacao do Preview gravados.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clash-izzy-preview-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-restore-metadata.json
          retention-days: 30
          if-no-files-found: error
      - name: Aplicar migrations ao banco Preview isolado (nunca producao)
        run: npx wrangler --config wrangler.preview-migrations.jsonc d1 migrations apply PREVIEW_DB --remote
      - name: Verificar esquema completo e 0030 no Preview
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["ACCOUNT_ID"]
          db="6674c0ac-3636-4e57-bff8-23cf60ab9637"
          url="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+db+"/query"
          sql="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('players','kingdoms','player_accounts','purchase_requests','mercadopago_orders','kingdom_dragons','kingdom_mailbox','master_bonus_claims','d1_migrations')"
          req=urllib.request.Request(url,data=json.dumps({"sql":sql}).encode(),method="POST",headers={
            "Authorization":"Bearer "+token,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as response: value=json.loads(response.read().decode())
          if not value.get("success"): raise SystemExit("D1 Preview nao confirmou o esquema.")
          present={row["name"] for row in value["result"][0]["results"]}
          expected={"players","kingdoms","player_accounts","purchase_requests","mercadopago_orders","kingdom_dragons","kingdom_mailbox","master_bonus_claims","d1_migrations"}
          if present!=expected: raise SystemExit("Tabelas de Preview incompletas: "+str(sorted(expected-present)))
          sql="SELECT COUNT(*) AS total FROM d1_migrations WHERE name='0030_dragons_master_mailbox.sql'"
          req=urllib.request.Request(url,data=json.dumps({"sql":sql}).encode(),method="POST",headers={
            "Authorization":"Bearer "+token,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as response: value=json.loads(response.read().decode())
          if int(value["result"][0]["results"][0]["total"])!=1:
            raise SystemExit("Migration 0030 nao confirmada no Preview.")
          print("PASSOU: D1 Preview isolado com esquema 0030 e 9 tabelas esperadas; producao nao modificada.")
          PY
