name: Beta gameplay and economy checks (offline)
on:
  pull_request:
    branches: [beta]
  push:
    branches: [beta]
permissions:
  contents: read
jobs:
  gameplay-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check closed-beta flags before regression tests
        run: node beta/check-isolation.mjs
      - name: Castle skins, ownership, combat and collection idempotency
        run: node --test tests/castle-skin-equip.test.js tests/castle-skin-combat.test.js tests/skin-sets.test.js tests/skin-set-combat-integration.test.js tests/economy-atomicity.test.js tests/equipment-enhancement.test.js tests/equipment-authority.test.js tests/equipment-hierarchy.test.js tests/equipment-progression.test.js
      - name: Dragons and package rules (no real transactions)
        run: node --test tests/dragons-master-pack.test.js tests/daily-package-offers.test.js tests/level-packs.test.js tests/starter-package-399.test.js
      - name: Existing queue, march and realtime safety regressions
        run: node --test tests/kingdom-queues.test.js tests/march-capacity.test.js tests/march-slots.test.js tests/eldoria-realtime-client.test.js tests/eldoria-realtime-routing.test.js tests/eldoria-room.test.js
      - name: Synthetic load harness checks (mock transport only)
        run: node --test tests/staging-load-smoke.test.js
