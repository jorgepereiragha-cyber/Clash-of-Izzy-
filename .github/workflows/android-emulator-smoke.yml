name: Android emulator launch smoke (staging only)
on:
  push:
    branches:
      - integration/full-eldoria-candidate-20261121
    paths:
      - .github/workflows/android-emulator-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build independent APK (debug)
        working-directory: android-sideload
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and verify APK launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh
      - name: Preserve screenshot (no authentication or payment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clash-of-izzy-android-emulator-smoke
          path: test-results/android-emulator/
          if-no-files-found: ignore
          retention-days: 7
