name: Blueprint v53 - qualidade mobile isolada
on:
  push:
    branches: [fix/blueprint-mobile-visual-cache-v53]
  pull_request:
    branches: [feat/level-packs-p1-p8-secure]
permissions:
  contents: read
concurrency:
  group: coi-blueprint-v53-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências sem scripts remotos
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verificar sintaxe de scripts do navegador e Worker
        run: |
          node --check sw.js
          node --check scripts/castle-visual-upgrades.js
          node --check scripts/kingdom-3d.js
          node --check worker.js
      - name: Aplicar migrations somente em D1 local de teste
        run: npm run db:migrate:local
      - name: Testar contratos, integração e Service Worker
        run: npm test
      - name: Conferir assets e build Worker sem deploy
        run: |
          npm run assets:validate
          npm run check
