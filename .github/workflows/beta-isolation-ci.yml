name: Beta isolation checks (no deploy)
on:
  pull_request:
    branches: [beta]
    paths:
      - wrangler.beta.jsonc
      - beta-access.js
      - beta-access.html
      - beta/**
      - android-sideload/**
      - tests/beta-isolation.test.js
      - .github/workflows/beta-isolation-ci.yml
      - .github/workflows/android-beta-apk.yml
      - .assetsignore
      - worker.js
      - kingdom.html
      - intermediate-production.js
      - city-defense-rules.js
      - player-progression-4x.js
      - hero-assignments-4x.js
      - scripts/kingdom-3d.js
      - scripts/kingdom-4x-systems.js
      - migrations/**
      - tests/**
      - package.json
  push:
    branches: [beta]
    paths:
      - wrangler.beta.jsonc
      - beta-access.js
      - beta-access.html
      - beta/**
      - android-sideload/**
      - tests/beta-isolation.test.js
      - .github/workflows/beta-isolation-ci.yml
      - .github/workflows/android-beta-apk.yml
      - .assetsignore
      - worker.js
      - kingdom.html
      - intermediate-production.js
      - city-defense-rules.js
      - player-progression-4x.js
      - hero-assignments-4x.js
      - scripts/kingdom-3d.js
      - scripts/kingdom-4x-systems.js
      - migrations/**
      - tests/**
      - package.json
permissions:
  contents: read
jobs:
  beta-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verificar preflight de isolamento sem exigir D1 remoto
        run: node beta/check-isolation.mjs
      - name: Node tests - beta/Android
        run: node --test tests/beta-isolation.test.js tests/beta-preflight.test.js tests/android-apk-sideload.test.js tests/advanced-4x-systems.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK ausente}"
          sdkmanager_cmd="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_cmd"
          yes | "$sdkmanager_cmd" --licenses > /dev/null || true
          "$sdkmanager_cmd" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile beta without signing or publishing
        working-directory: android-sideload
        run: gradle --no-daemon assembleBeta
