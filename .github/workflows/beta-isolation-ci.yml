name: Beta isolation checks (no deploy)
on:
  pull_request:
    branches: [beta]
  push:
    branches: [beta]
permissions:
  contents: read
jobs:
  beta-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verificar preflight de isolamento sem exigir D1 remoto
        run: node beta/check-isolation.mjs
      - name: Node tests - beta/Android
        run: node --test tests/beta-isolation.test.js tests/beta-preflight.test.js tests/android-apk-sideload.test.js tests/advanced-4x-systems.test.js tests/march-scheduler.test.js tests/scheduled-marches.test.js
      - name: Validate beta invitation SQL locally (no remote D1)
        run: python3 beta/verify-schema-local.py
      - name: Validate existing 3D manifest and referenced GLB files
        run: node scripts/validate-3d-assets.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK ausente}"
          sdkmanager_cmd="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_cmd"
          yes | "$sdkmanager_cmd" --licenses > /dev/null || true
          "$sdkmanager_cmd" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile beta without signing or publishing
        working-directory: android-sideload
        run: gradle --no-daemon assembleBeta

  beta-local-runtime:
    name: Beta real Worker + D1 local (no Cloudflare API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies without a lockfile
        run: npm install --no-save --no-audit --no-fund --package-lock=false
      - name: Vendor pinned Three.js for local static assets
        run: npm run vendor:three
      - name: Install Chromium for real mobile browser smoke
        run: npx playwright install --with-deps chromium
      - name: Smoke real beta Worker and local D1 (no deployment)
        run: node --test tests/beta-runtime-local.test.js
        env:
          BETA_BROWSER_SMOKE: '1'
      - name: Archive synthetic kingdom rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-kingdom-visual-evidence
          path: test-results/beta-visual/
          if-no-files-found: ignore
          retention-days: 7
