name: Eldoria Visual + Realtime Staging Validation

on:
  push:
    branches:
      - feat/realtime-eldoria-visual-compatible-20261121

permissions:
  contents: read

concurrency:
  group: eldoria-visual-realtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Confirm local D1 migrations only
        run: npx wrangler --config wrangler.jsonc d1 migrations apply clash-of-izzy-db --local
      - name: Validate assets
        run: npm run assets:validate
      - name: Test gameplay, realtime and client contracts
        run: npm test
      - name: Verify Worker bundle (no deployment)
        run: npm run check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check mobile/browser flows
        run: npm run test:e2e
